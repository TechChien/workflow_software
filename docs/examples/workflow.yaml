id: requirement-analysis-flow
name: Requirement Analysis Flow
version: 0.1.0
inputs: {}
artifacts: {}
steps:
  - id: g1_intent_freeze
    type: agent
    downstream: g2_gap_analysis
    input_artifacts: []
    output_artifacts:
      - artifact: g1_requirements
        filename: requirements.md
    context_paths: []
    tool_capabilities:
      - "*"
    prompt: |
      Convert the original request into intent-layer requirements.
    acceptance:
      criteria: |
        No implementation-layer details.

  - id: g2_gap_analysis
    type: code_agent
    upstream: g1_intent_freeze
    input_artifacts:
      - artifact: g1_requirements
    output_artifacts:
      - artifact: g2_gap_summary
        filename: g2-gap-summary.md
      - artifact: g2_evidence_index
        filename: g2-evidence-index.md
    context_paths:
      - path: src
        type: directory
        optional: true
    tool_capabilities:
      - "*"
    prompt: |
      Inspect the accepted artifact inputs and optional worktree-relative context.
    acceptance:
      criteria: |
        Every codebase claim must cite file and line evidence.
